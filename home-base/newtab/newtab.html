<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/tasks.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <canvas id="bg-canvas"></canvas>
    <div id="bg-photo" class="bg-photo"></div>
    <div id="bg-dim" class="bg-dim"></div>
  </div>

  <div class="shell">
    <header class="top">
      <div class="top-left">
        <form id="search-form" class="search" role="search">
          <label class="sr-only" for="search-input">Search the web</label>
          <span class="search-icon" id="search-icon"></span>
          <input id="search-input" type="search" placeholder="Search the web" autocomplete="off" spellcheck="false">
        </form>
        <nav class="links" id="links" aria-label="Quick links"></nav>
      </div>
      <div class="top-right">
        <button class="glass-btn" id="tasks-btn" type="button" title="Open tasks">Tasks</button>
        <button class="glass-btn icon-only" id="widgets-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="widgets-menu" title="Widgets"></button>
        <button class="glass-btn icon-only" id="settings-btn" type="button" title="Settings" aria-label="Settings"></button>
        <div class="menu" id="widgets-menu" role="menu" hidden></div>
      </div>
    </header>

    <main class="center" id="center">
      <div class="clock" id="clock" aria-live="off"></div>
      <div class="greeting" id="greeting"></div>
      <section class="focus" id="focus" aria-label="Today's focus"></section>
    </main>

    <footer class="bottom">
      <div class="bg-info">
        <button class="glass-btn icon-only" id="shuffle-btn" type="button" title="New background" aria-label="New background"></button>
        <span id="bg-name" class="bg-name"></span>
      </div>
      <figure class="quote" id="quote">
        <blockquote id="quote-text"></blockquote>
        <button class="quote-next" id="quote-next" type="button" title="Another line" aria-label="Show another line"></button>
      </figure>
      <div class="bottom-right" id="today-label"></div>
    </footer>
  </div>

  <div class="widgets" id="widgets" aria-label="Widgets"></div>
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

  <dialog id="link-dialog" aria-labelledby="ld-title">
    <form class="dialog-body" method="dialog" id="link-form">
      <h2 id="ld-title" style="font-size:16px">Add link</h2>
      <label class="field"><span>Name</span><input class="input" id="ld-title-input" type="text" maxlength="40" placeholder="Optional"></label>
      <label class="field"><span>Address</span><input class="input" id="ld-url" type="text" required placeholder="example.com"></label>
      <div class="small" id="ld-error" style="color:var(--danger)" aria-live="polite"></div>
      <div class="dialog-foot">
        <button class="btn danger" id="ld-delete" type="button" style="margin-right:auto" hidden>Remove</button>
        <button class="btn" type="submit" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" type="submit" value="save">Save</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="newtab.js"></script>
</body>
</html>
