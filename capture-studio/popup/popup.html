<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Capture Studio</title>
  <link rel="stylesheet" href="../lib/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <svg class="logo" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="#e5484d"/><circle cx="64" cy="64" r="26" fill="#fff"/><circle cx="64" cy="64" r="14" fill="#e5484d"/></svg>
    <h1>Capture Studio</h1>
    <button id="open-library" class="btn ghost icon" title="Library" aria-label="Open library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>
    </button>
  </header>

  <div id="error" class="banner" role="alert" hidden>
    <span id="error-text"></span>
    <button id="error-close" class="btn ghost icon" aria-label="Dismiss">&times;</button>
  </div>

  <!-- Recording in progress -->
  <section id="live" class="live" hidden aria-live="polite">
    <div class="live-head">
      <span class="dot" id="live-dot"></span>
      <span id="live-label">Recording</span>
    </div>
    <div class="timer" id="live-timer">0:00</div>
    <p class="muted small" id="live-hint"></p>
    <div class="live-actions">
      <button id="btn-pause" class="btn">Pause</button>
      <button id="btn-stop" class="btn primary">Stop and save</button>
      <button id="btn-focus" class="btn" hidden>Go to recorder</button>
      <button id="btn-discard" class="btn ghost danger">Discard</button>
    </div>
  </section>

  <main id="idle">
    <section class="section">
      <h2>Screenshot</h2>
      <div class="tiles">
        <button class="tile" data-shot="visible">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>
          <span>Visible area</span>
        </button>
        <button class="tile" data-shot="region">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
          <span>Select region</span>
        </button>
        <button class="tile" data-shot="full">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 7v10M9 14l3 3 3-3"/></svg>
          <span>Full page</span>
        </button>
      </div>
      <p class="muted small" id="shot-hint"><span class="kbd" id="shortcut">Alt+Shift+S</span> selects a region on any page.</p>
    </section>

    <section class="section">
      <h2>Record</h2>
      <div class="segmented" role="radiogroup" aria-label="What to record">
        <label><input type="radio" name="mode" value="tab" checked><span>This tab</span></label>
        <label><input type="radio" name="mode" value="window"><span>Window</span></label>
        <label><input type="radio" name="mode" value="screen"><span>Full screen</span></label>
      </div>

      <div class="opt">
        <div class="opt-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <label for="opt-mic">Microphone</label>
          <span class="switch"><input type="checkbox" id="opt-mic"><span></span></span>
        </div>
        <select id="mic-device" aria-label="Microphone device" hidden></select>
      </div>
      <div class="opt">
        <div class="opt-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          <label for="opt-audio" id="audio-label">Tab audio</label>
          <span class="switch"><input type="checkbox" id="opt-audio"><span></span></span>
        </div>
      </div>
      <div class="opt">
        <div class="opt-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="6"/><circle cx="12" cy="10" r="2"/><path d="M8 21h8M12 16v5"/></svg>
          <label for="opt-cam">Webcam bubble</label>
          <span class="switch"><input type="checkbox" id="opt-cam"><span></span></span>
        </div>
        <div class="sub" id="cam-sub" hidden>
          <select id="cam-device" aria-label="Camera device"></select>
          <select id="cam-size" aria-label="Bubble size">
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
          </select>
        </div>
      </div>
      <div class="opt">
        <div class="opt-row">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>
          <label for="opt-countdown">Countdown</label>
          <select id="opt-countdown">
            <option value="0">Off</option>
            <option value="3">3 seconds</option>
            <option value="5">5 seconds</option>
          </select>
        </div>
      </div>
      <button id="start" class="btn primary start">
        <span class="rec-dot"></span> Start recording
      </button>
      <p class="muted small" id="rec-hint"></p>
    </section>
  </main>

  <footer class="foot">
    <button class="link" id="go-library">Library</button>
    <button class="link" id="go-editor">Open image in editor</button>
    <button class="link" id="go-shortcuts">Shortcuts</button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
