<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capture Studio - Editor</title>
  <link rel="stylesheet" href="../lib/ui.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="toolbar" role="toolbar" aria-label="Editor toolbar">
    <a class="brand" href="../library/library.html?tab=shots" title="Open library">
      <svg viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="28" fill="#e5484d"/><circle cx="64" cy="64" r="26" fill="#fff"/><circle cx="64" cy="64" r="14" fill="#e5484d"/></svg>
    </a>
    <div class="group tools" id="tools">
      <button class="tool" data-tool="select" title="Select and move (V)" aria-label="Select (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z"/></svg></button>
      <button class="tool" data-tool="arrow" title="Arrow (A)" aria-label="Arrow (A)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg></button>
      <button class="tool" data-tool="rect" title="Rectangle (R)" aria-label="Rectangle (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg></button>
      <button class="tool" data-tool="ellipse" title="Ellipse (E)" aria-label="Ellipse (E)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg></button>
      <button class="tool" data-tool="pen" title="Freehand (P)" aria-label="Freehand (P)"><svg viewBox="0 0 24 24"><path d="M4 18c3-1 4-8 7-8s2 6 5 6 3-5 4-6"/></svg></button>
      <button class="tool" data-tool="text" title="Text (T)" aria-label="Text (T)"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
      <button class="tool" data-tool="highlight" title="Highlight (H)" aria-label="Highlight (H)"><svg viewBox="0 0 24 24"><path d="M9 15l-3 3h4l1-1M9 15l7-11 4 3-7 11z"/><path d="M4 21h16" opacity=".6"/></svg></button>
      <button class="tool" data-tool="blur" title="Blur (B)" aria-label="Blur (B)"><svg viewBox="0 0 24 24"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg></button>
      <button class="tool" data-tool="pixelate" title="Pixelate (X)" aria-label="Pixelate (X)"><svg viewBox="0 0 24 24"><path d="M4 4h5v5H4zM15 4h5v5h-5zM9.5 9.5h5v5h-5zM4 15h5v5H4zM15 15h5v5h-5z"/></svg></button>
      <button class="tool" data-tool="crop" title="Crop (C)" aria-label="Crop (C)"><svg viewBox="0 0 24 24"><path d="M6 2v16h16M2 6h16v16"/></svg></button>
    </div>
    <div class="group" id="colors" role="radiogroup" aria-label="Color"></div>
    <label class="custom-color" title="Custom color"><input type="color" id="custom-color" aria-label="Custom color"></label>
    <div class="group sizes" id="sizes" role="radiogroup" aria-label="Stroke size">
      <button class="size" data-size="1" title="Thin (1)" aria-label="Thin"><span style="--d:4px"></span></button>
      <button class="size" data-size="2" title="Medium (2)" aria-label="Medium"><span style="--d:7px"></span></button>
      <button class="size" data-size="3" title="Thick (3)" aria-label="Thick"><span style="--d:10px"></span></button>
      <button class="size" data-size="4" title="Extra thick (4)" aria-label="Extra thick"><span style="--d:14px"></span></button>
    </div>
    <div class="group">
      <button class="btn icon ghost" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button class="btn icon ghost" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
      <button class="btn icon ghost" id="delete" title="Delete selected (Del)" aria-label="Delete selected"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
    </div>
    <span class="spacer"></span>
    <div class="group">
      <button class="btn ghost" id="copy" title="Copy to clipboard (Ctrl+C)"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>Copy</button>
      <select id="format" aria-label="File format">
        <option value="png">PNG</option>
        <option value="jpeg">JPEG</option>
      </select>
      <button class="btn primary" id="save" title="Download (Ctrl+S)"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download</button>
    </div>
  </header>

  <div class="cropbar" id="cropbar" hidden>
    <span>Drag to choose the area to keep.</span>
    <button class="btn" id="crop-reset">Reset crop</button>
    <button class="btn" id="crop-cancel">Cancel <span class="kbd">Esc</span></button>
    <button class="btn blue" id="crop-apply">Apply <span class="kbd">Enter</span></button>
  </div>

  <main class="workspace" id="workspace">
    <div class="canvas-wrap" id="wrap">
      <canvas id="canvas" tabindex="0" aria-label="Screenshot canvas"></canvas>
    </div>
    <section class="empty" id="empty" hidden>
      <div class="empty-card">
        <svg viewBox="0 0 24 24" class="empty-icon"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>
        <h1>Open an image to annotate</h1>
        <p class="muted">Drop an image here, paste one with <span class="kbd">Ctrl+V</span>, or choose a file. You can also take a screenshot from the toolbar button.</p>
        <label class="btn primary file-btn">Choose image<input type="file" id="file" accept="image/*" hidden></label>
      </div>
    </section>
  </main>

  <footer class="status">
    <span id="st-title" class="title"></span>
    <span id="st-size"></span>
    <span class="spacer"></span>
    <span id="st-saved" class="muted"></span>
    <div class="zoom">
      <button class="btn ghost icon" id="zoom-out" title="Zoom out (Ctrl+-)" aria-label="Zoom out">-</button>
      <button class="btn ghost" id="zoom-label" title="Toggle fit / 100% (Ctrl+0)">100%</button>
      <button class="btn ghost icon" id="zoom-in" title="Zoom in (Ctrl+=)" aria-label="Zoom in">+</button>
    </div>
  </footer>
  <textarea id="text-input" class="text-input" spellcheck="false" hidden aria-label="Annotation text"></textarea>
  <script type="module" src="editor.js"></script>
</body>
</html>
