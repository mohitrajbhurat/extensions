<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Workbench</title>
<link rel="stylesheet" href="../lib/jsontree.css">
<link rel="stylesheet" href="workbench.css">
</head>
<body>
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 128 128" aria-hidden="true" focusable="false">
        <rect x="8" y="8" width="112" height="112" rx="26" fill="currentColor" opacity=".12"></rect>
        <path d="M40 44 24 64l16 20M88 44l16 20-16 20M74 36 54 92" fill="none" stroke="currentColor"
              stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span class="brand-name">API Workbench</span>
    </div>
    <div class="topbar-spacer"></div>
    <label class="env-picker">
      <span class="env-label">Environment</span>
      <select id="envSelect" aria-label="Active environment"></select>
    </label>
    <button id="btnImport" class="btn" type="button">Import</button>
    <button id="btnSettings" class="btn btn-icon" type="button" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 10.5A2.5 2.5 0 1 1 8 5.5a2.5 2.5 0 0 1 0 5Zm0-1.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/><path fill="currentColor" d="M6.8.5h2.4l.35 1.76 1.1.46 1.5-.98 1.7 1.7-.98 1.5.46 1.1L15.5 6.8v2.4l-1.76.35-.46 1.1.98 1.5-1.7 1.7-1.5-.98-1.1.46L9.2 15.5H6.8l-.35-1.76-1.1-.46-1.5.98-1.7-1.7.98-1.5-.46-1.1L.5 9.2V6.8l1.76-.35.46-1.1-.98-1.5 1.7-1.7 1.5.98 1.1-.46Zm1.17 1.5-.26 1.3-2.2.92-1.1-.72-.33.33.72 1.1-.92 2.2-1.3.26v.47l1.3.26.92 2.2-.72 1.1.33.33 1.1-.72 2.2.92.26 1.3h.47l.26-1.3 2.2-.92 1.1.72.33-.33-.72-1.1.92-2.2 1.3-.26V7.9l-1.3-.26-.92-2.2.72-1.1-.33-.33-1.1.72-2.2-.92L8.44 2Z"/></svg>
    </button>
  </header>

  <div class="main">
    <aside class="sidebar" id="sidebar">
      <nav class="side-tabs" role="tablist" aria-label="Sidebar sections">
        <button class="side-tab active" data-side="collections" role="tab" aria-selected="true" type="button">Collections</button>
        <button class="side-tab" data-side="env" role="tab" aria-selected="false" type="button">Variables</button>
        <button class="side-tab" data-side="history" role="tab" aria-selected="false" type="button">History</button>
      </nav>
      <div class="side-body" id="sideBody"></div>
    </aside>
    <div class="splitter" id="splitV" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize sidebar"></div>

    <section class="workspace">
      <div class="tabstrip" id="tabstrip" role="tablist" aria-label="Open requests"></div>
      <div class="panes" id="panes">
        <div class="req-pane" id="reqPane"></div>
        <div class="splitter-h" id="splitH" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Resize response pane"></div>
        <div class="res-pane" id="resPane"></div>
      </div>
    </section>
  </div>

  <div class="toasts" id="toasts" aria-live="polite" role="status"></div>
</div>

<dialog id="modal" class="modal"></dialog>
<div id="bootError" class="boot-error" hidden></div>
<script type="module" src="workbench.js"></script>
</body>
</html>
