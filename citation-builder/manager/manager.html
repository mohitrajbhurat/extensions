<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bibliography · Citation Builder</title>
<link rel="icon" href="../icons/icon32.png">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="manager.css">
</head>
<body>
<header class="app-header">
  <div class="brand">
    <img src="../icons/icon32.png" width="24" height="24" alt="">
    <span>Citation Builder</span>
  </div>
  <div class="search">
    <label class="sr-only" for="search">Search citations</label>
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input id="search" type="search" placeholder="Search title, author, journal…  ( / )" autocomplete="off">
  </div>
  <div class="header-controls">
    <label class="ctl"><span>Style</span><select id="style"></select></label>
    <label class="ctl"><span>Sort</span>
      <select id="sort">
        <option value="auto">Style default</option>
        <option value="author">Author A–Z</option>
        <option value="title">Title A–Z</option>
        <option value="date">Date (oldest)</option>
        <option value="date-desc">Date (newest)</option>
        <option value="added">Date added (oldest)</option>
        <option value="added-desc">Date added (newest)</option>
      </select>
    </label>
    <button class="icon-btn" id="open-options" type="button" title="Options" aria-label="Options">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M8 1.8v1.8M8 12.4v1.8M1.8 8h1.8M12.4 8h1.8M3.6 3.6l1.3 1.3M11.1 11.1l1.3 1.3M3.6 12.4l1.3-1.3M11.1 4.9l1.3-1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" aria-label="Projects">
    <div class="sidebar-head">
      <h2>Projects</h2>
      <button class="icon-btn" id="new-project" type="button" title="New project" aria-label="New project">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <nav><ul id="project-list" class="project-list"></ul></nav>
  </aside>

  <main class="content">
    <div class="project-head">
      <div class="title-wrap">
        <h1 id="project-title">Bibliography</h1>
        <span id="project-count" class="muted"></span>
        <button id="dup-filter" class="badge warn as-btn" type="button" hidden></button>
      </div>
      <div class="project-actions">
        <button class="btn btn-primary" id="add" type="button" title="Add a citation (N)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Add citation
        </button>
        <button class="btn" id="copy-all" type="button">Copy bibliography</button>
        <div class="dropdown">
          <button class="btn" id="export-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="export-menu">Export ▾</button>
          <div class="menu" id="export-menu" role="menu" hidden>
            <button role="menuitem" type="button" data-export="bib">BibTeX (.bib)</button>
            <button role="menuitem" type="button" data-export="ris">RIS (.ris)</button>
            <button role="menuitem" type="button" data-export="txt">Plain text (.txt)</button>
            <button role="menuitem" type="button" data-export="html">Web page (.html)</button>
          </div>
        </div>
        <div class="dropdown">
          <button class="icon-btn" id="project-more" type="button" title="Project actions" aria-label="Project actions" aria-haspopup="menu" aria-expanded="false" aria-controls="project-menu">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="12.5" cy="8" r="1.3" fill="currentColor"/></svg>
          </button>
          <div class="menu" id="project-menu" role="menu" hidden>
            <button role="menuitem" type="button" data-action="rename">Rename project</button>
            <button role="menuitem" type="button" data-action="delete" class="danger">Delete project</button>
          </div>
        </div>
      </div>
    </div>

    <div id="bulk-bar" class="bulk-bar" hidden>
      <label class="check"><input type="checkbox" id="select-all"> <span id="bulk-count">0 selected</span></label>
      <button class="btn btn-sm" id="bulk-copy" type="button">Copy selected</button>
      <label class="sr-only" for="bulk-move">Move or copy selected to project</label>
      <select id="bulk-move" class="btn-sm"></select>
      <button class="btn btn-sm btn-danger" id="bulk-delete" type="button">Delete selected</button>
      <button class="btn btn-sm btn-ghost" id="bulk-clear" type="button">Clear selection</button>
    </div>

    <ol id="entries" class="entries" aria-label="Citations"></ol>
    <div id="empty" class="empty" hidden>
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M14 10h26l10 10v34H14z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M22 30h20M22 38h20M22 46h12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      <h2 id="empty-title">No citations yet</h2>
      <p id="empty-text">Open any article, book page or video and click the Citation Builder button, or right-click and choose <b>Cite this page</b>.</p>
      <button class="btn btn-primary" id="empty-add" type="button">Add a citation by hand</button>
    </div>
  </main>
</div>

<dialog id="edit-dialog" class="sheet" aria-labelledby="edit-title">
  <form method="dialog" class="sheet-inner" id="edit-form">
    <header class="sheet-head">
      <h2 id="edit-title">Edit citation</h2>
      <button class="icon-btn" value="cancel" formnovalidate type="submit" aria-label="Close">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="sheet-body">
      <div class="quick-add" id="quick-add">
        <label for="quick-id">Start from a DOI, ISBN, arXiv ID or DOI link</label>
        <div class="quick-row">
          <input id="quick-id" placeholder="10.1038/nature14539  ·  978-0262035613  ·  arXiv:1706.03762">
          <button class="btn" id="quick-go" type="button">Fill</button>
        </div>
        <p class="muted" id="quick-help"></p>
      </div>
      <div class="sheet-preview">
        <div class="eyebrow">Preview</div>
        <div id="edit-preview" class="citation hanging"></div>
      </div>
      <div class="field">
        <label for="edit-project">Project</label>
        <select id="edit-project"></select>
      </div>
      <div id="edit-editor"></div>
    </div>
    <footer class="sheet-foot">
      <span id="edit-dup" class="badge warn" hidden></span>
      <span class="spacer"></span>
      <button class="btn btn-ghost" value="cancel" formnovalidate type="submit">Cancel</button>
      <button class="btn btn-primary" id="edit-save" type="button">Save</button>
    </footer>
  </form>
</dialog>

<dialog id="prompt-dialog" class="small-dialog" aria-labelledby="prompt-title">
  <form method="dialog" id="prompt-form">
    <h2 id="prompt-title">Project name</h2>
    <p id="prompt-text" class="muted"></p>
    <label class="sr-only" for="prompt-input">Value</label>
    <input id="prompt-input" maxlength="80">
    <div class="dialog-actions">
      <button class="btn btn-ghost" value="cancel" formnovalidate>Cancel</button>
      <button class="btn btn-primary" value="ok" id="prompt-ok">OK</button>
    </div>
  </form>
</dialog>

<script type="module" src="manager.js"></script>
</body>
</html>
