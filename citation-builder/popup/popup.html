<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citation Builder</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="top">
  <img src="../icons/icon32.png" width="20" height="20" alt="">
  <h1>Citation Builder</h1>
  <label class="sr-only" for="style">Citation style</label>
  <select id="style" title="Citation style"></select>
  <button class="icon-btn" id="open-manager" type="button" title="Open bibliography manager" aria-label="Open bibliography manager">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h7.5L13 5v8.5H3z M10.5 2.5V5H13 M5.5 8h5 M5.5 10.5h5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/></svg>
  </button>
  <button class="icon-btn" id="open-options" type="button" title="Options" aria-label="Options">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M8 1.8v1.8M8 12.4v1.8M1.8 8h1.8M12.4 8h1.8M3.6 3.6l1.3 1.3M11.1 11.1l1.3 1.3M3.6 12.4l1.3-1.3M11.1 4.9l1.3-1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  </button>
</header>

<main>
  <div id="status" class="notice" role="status" aria-live="polite">Reading page…</div>

  <section class="preview-card" aria-labelledby="preview-label">
    <div class="preview-head">
      <span id="preview-label" class="eyebrow">Preview</span>
      <span id="style-name" class="muted"></span>
    </div>
    <div id="preview" class="citation hanging" aria-live="polite"></div>
    <div class="intext"><span class="muted" id="intext-label">In-text</span> <span id="intext" class="citation-inline"></span></div>
    <div class="preview-actions">
      <button class="btn btn-primary" id="copy" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M3 10.5V3.5A1.5 1.5 0 0 1 4.5 2h6" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
        Copy citation
      </button>
      <button class="btn" id="copy-intext" type="button">Copy in-text</button>
      <div class="more">
        <button class="btn btn-ghost" id="more-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu">More ▾</button>
        <div class="menu" id="more-menu" role="menu" hidden>
          <button role="menuitem" type="button" data-copy="plain">Copy as plain text</button>
          <button role="menuitem" type="button" data-copy="note">Copy footnote (Chicago)</button>
          <button role="menuitem" type="button" data-copy="bibtex">Copy BibTeX</button>
          <button role="menuitem" type="button" data-copy="ris">Copy RIS</button>
          <button role="menuitem" type="button" data-copy="reextract">Re-read page</button>
        </div>
      </div>
    </div>
  </section>

  <div id="lookup-bar" class="lookup-bar" hidden>
    <span id="lookup-text"></span>
    <button class="btn btn-sm" id="lookup-btn" type="button">Fill from online record</button>
  </div>

  <section aria-label="Citation details">
    <div id="editor"></div>
  </section>
</main>

<footer class="save-bar">
  <div id="dup-warning" class="notice warn" hidden></div>
  <div class="save-row">
    <label class="sr-only" for="project">Project</label>
    <select id="project" title="Project"></select>
    <button class="btn btn-primary" id="save" type="button" title="Save to project (Ctrl+Enter)">Save</button>
  </div>
  <div class="new-project" id="new-project" hidden>
    <label class="sr-only" for="new-project-name">New project name</label>
    <input id="new-project-name" placeholder="New project name" maxlength="80">
    <button class="btn btn-sm" id="new-project-ok" type="button">Create</button>
    <button class="btn btn-sm btn-ghost" id="new-project-cancel" type="button">Cancel</button>
  </div>
</footer>
<script type="module" src="popup.js"></script>
</body>
</html>
